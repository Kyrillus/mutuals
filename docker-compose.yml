# The database only (ADR-012). The apps run on the host so `pnpm dev` stays a
# normal Node dev loop with working watch mode and debugger attach.
#
# Postgres 16 exactly as the brief fixes it (ADR-002). 17 and 18 also work --
# the schema uses no feature above 15 -- which is what the Postgres.app and
# Homebrew fallbacks in the README provide.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mutuals-db
    environment:
      POSTGRES_USER: mutuals
      POSTGRES_PASSWORD: mutuals
      POSTGRES_DB: mutuals_dev
    # Postgres puts parallel workers' shared memory in /dev/shm, and Docker's 64 MB default is
    # too small for a parallel VACUUM or index build: measured, it fails with
    # "could not resize shared memory segment ... No space left on device".
    shm_size: 1gb
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - mutuals-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mutuals -d mutuals_dev']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  mutuals-pgdata:
