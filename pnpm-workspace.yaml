packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# Exact pins everywhere (ADR-004). Dependabot keeps them moving; a range would
# make "it worked yesterday" unreproducible.
savePrefix: ''
dedupePeerDependents: true
verifyDepsBeforeRun: install

# pnpm 11 takes a map here; onlyBuiltDependencies and friends were removed in v11.
allowBuilds:
  esbuild: true
  # msw's postinstall copies a service worker into a public/ directory for browser mode.
  # ADR-072 uses `msw/node` only -- the transport is tested in Node, never in a page -- so the
  # script has nothing to do here.
  msw: false

minimumReleaseAgeExclude:
  - '@rolldown/binding-android-arm64@1.2.7'
  - '@rolldown/binding-darwin-arm64@1.2.7'
  - '@rolldown/binding-freebsd-x64@1.2.7'
  - '@rolldown/binding-linux-ppc64-gnu@1.2.7'
  - '@rolldown/binding-linux-x64-gnu@1.2.7'
  - '@rolldown/binding-openharmony-arm64@1.2.7'
  - '@types/react-dom@19.2.7'
  - lucide-react@1.40.0
